<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Show Production Checklist</title>
  <link rel="stylesheet" href="./styles-v5.css?v=5">
</head>
<body>
  <a class="planuf-hub-link" href="../">← PLANUF APPS</a>
  <div class="shell">
    <header class="top">
      <div><div class="eyebrow">PLANUF · PRODUCTION PACK</div><h1>Show Production Checklist</h1></div>
      <div class="actions">
        <span id="status" class="status">Loading shared…</span>
        <button id="reload" class="btn alt" type="button">Reload Shared</button>
        <button id="pinBtn" class="btn alt" type="button">Edit PIN</button>
        <button id="save" class="btn" type="button">Save Shared Changes</button>
      </div>
    </header>
    <section class="panel showbar">
      <label class="field showpick"><span>Show</span><select id="shows"></select></label>
      <div class="toolbar"><button id="addShow" class="btn" type="button">+ Add Show</button><button id="renameShow" class="btn alt" type="button">Rename</button><button id="deleteShow" class="btn danger" type="button">Delete</button></div>
    </section>
    <section class="panel progress"><strong id="progressText">0 of 0 complete</strong><div class="track"><div id="progressBar" class="bar"></div></div><strong id="progressPct">0%</strong></section>
    <section><div class="heading"><h2 id="showTitle">Show</h2><button id="addItem" class="btn alt" type="button">+ Add Checklist Item</button></div><div id="grid" class="grid"></div></section>
  </div>
  <div id="toastbox" class="toastbox" aria-live="polite"></div>
  <dialog id="pinDialog">
    <form id="pinForm">
      <h2>Shared Edit PIN</h2>
      <p>Enter the same EDIT_PIN stored in the checklist Cloudflare Worker. It stays only in this browser tab.</p>
      <label class="field"><span>Edit PIN</span><input id="pin" type="password" autocomplete="off" required></label>
      <div class="dialogactions"><button id="forgetPin" type="button" class="btn danger">Forget PIN</button><button type="button" class="btn alt" data-close="pinDialog">Cancel</button><button class="btn" type="submit">Use PIN</button></div>
    </form>
  </dialog>
  <script src="./config.js?v=5"></script>
  <script src="./app-v5.js?v=5"></script>
</body>
</html>
