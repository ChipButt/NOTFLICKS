<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131a">
<title>Show Production Checklist</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eef1f7;font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}.shell{width:min(1280px,calc(100% - 32px));margin:auto;padding:28px 0 60px}.top{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#838b9d;font-weight:800}.top h1{margin:3px 0 0;font-size:32px;letter-spacing:-.04em}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #313847;background:#eef1f7;color:#11151d;padding:10px 13px;border-radius:11px;font-weight:800;cursor:pointer}.btn.alt{background:#171b24;color:#e8ebf2}.btn.danger{background:#241417;color:#ffb0bb;border-color:#522831}.status{border:1px solid #303646;background:#161a22;color:#9da6b8;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800}.status.dirty{color:#ffd58a;border-color:#5a4728}.status.ok{color:#92e3b2;border-color:#28503b}.status.bad{color:#ffadb7;border-color:#5d2931}.panel{background:#12161e;border:1px solid #252b37;border-radius:18px;padding:18px}.showbar{display:flex;gap:14px;align-items:end;justify-content:space-between;margin-bottom:18px}.field{display:grid;gap:6px}.field span,.notes span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8992a5;font-weight:800}select,input,textarea{width:100%;background:#0d1016;color:#eef1f7;border:1px solid #303746;border-radius:10px;padding:10px 11px;font:inherit}.showpick{min-width:260px}.progress{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;margin-bottom:28px}.track{height:9px;background:#252a34;border-radius:999px;overflow:hidden}.bar{height:100%;background:#e7eaf0;width:0}.heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.heading h2{margin:0;font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#12161e;border:1px solid #252b37;border-radius:18px;padding:16px;display:grid;gap:13px}.cardhead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.card h3{margin:0;font-size:17px}.kind{font-size:11px;color:#8891a4}.check{width:22px;height:22px}.x{border:0;background:transparent;color:#737d91;font-size:23px;cursor:pointer}.preview{min-height:180px;background:#0c0f15;border:1px dashed #313847;border-radius:13px;display:grid;place-items:center;overflow:hidden;color:#677084;text-align:center;padding:12px}.preview img,.preview video{max-width:100%;max-height:320px}.preview audio{width:100%}.preview iframe{width:100%;height:300px;border:0;background:white}.fontsample{font-size:38px;line-height:1.1;text-align:center;padding:20px}.meta{font-size:12px;color:#8992a5;overflow-wrap:anywhere}.assetbuttons{display:flex;gap:8px;flex-wrap:wrap}.notes{display:grid;gap:6px}.notes textarea{min-height:90px;resize:vertical}.empty{padding:50px;text-align:center;color:#747d90;border:1px dashed #303746;border-radius:18px}.toastbox{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:20}.toast{background:#e9ecf2;color:#11151d;border-radius:12px;padding:11px 14px;box-shadow:0 12px 35px #0008;max-width:360px}.toast.err{background:#ffbdc5}dialog{background:#151922;color:#eef1f7;border:1px solid #323a49;border-radius:16px;padding:20px;min-width:min(430px,calc(100vw - 30px))}dialog::backdrop{background:#000a}dialog form{display:grid;gap:14px}dialog h2{margin:0}.dialogactions{display:flex;justify-content:flex-end;gap:8px}@media(max-width:760px){.top,.showbar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.progress{grid-template-columns:1fr}.showpick{min-width:0}.shell{width:min(100% - 20px,1280px)}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="eyebrow">PLANUF · PRODUCTION PACK</div><h1>Show Production Checklist</h1></div><div class="actions"><span id="status" class="status">Loading shared…</span><button id="reload" class="btn alt">Reload Shared</button><button id="pinBtn" class="btn alt">Edit PIN</button><button id="save" class="btn">Save Shared Changes</button></div></header>
<section class="panel showbar"><label class="field showpick"><span>Show</span><select id="shows"></select></label><div class="toolbar"><button id="addShow" class="btn">+ Add Show</button><button id="renameShow" class="btn alt">Rename</button><button id="deleteShow" class="btn danger">Delete</button></div></section>
<section class="panel progress"><strong id="progressText">0 of 0 complete</strong><div class="track"><div id="progressBar" class="bar"></div></div><strong id="progressPct">0%</strong></section>
<section><div class="heading"><h2 id="showTitle">Show</h2><button id="addItem" class="btn alt">+ Add Checklist Item</button></div><div id="grid" class="grid"></div></section>
</div>
<dialog id="pinDialog"><form id="pinForm"><h2>Shared Edit PIN</h2><p>Enter the shared PIN configured in the Cloudflare Worker. It is kept only for this browser tab.</p><label class="field"><span>Edit PIN</span><input id="pin" type="password" required></label><div class="dialogactions"><button id="forgetPin" type="button" class="btn danger">Forget PIN</button><button type="button" class="btn alt" data-close="pinDialog">Cancel</button><button class="btn">Use PIN</button></div></form></dialog>
<script src="./config.js"></script>
<script>
(()=>{'use strict';
const API=String(window.SHOW_CHECKLIST_API_URL||'').replace(/\/$/,'');const CACHE='planuf-checklist-cache-v3',PIN='planuf-checklist-pin-v1',MAX=20*1024*1024;
const defaults=[['Show Logo','document'],['Vertical Thumbnail — 4000 × 6000','image'],['Square Thumbnail — 6000 × 6000','image'],['Featured Carousel Wide — 3840 × 1440','image'],['Featured Carousel Mobile — 3000 × 2625','image'],['Show Font','font'],['Intro Music','audio'],['Outro Music','audio'],['Intro Video','video'],['Transitional Slide(s)','document']];
const label={document:'Document / artwork',image:'Image',font:'Font',audio:'Audio',video:'Video',file:'File'};const accept={document:'.pdf,image/*,.svg',image:'image/*,.svg',font:'.ttf,.otf,.woff,.woff2',audio:'audio/*',video:'video/*',file:'*/*'};
const $=id=>document.getElementById(id);let state=load(),sha='',dirty=false,busy=false;const fonts=[];init();
function id(p){return p+'-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())}function items(){return defaults.map(([title,type])=>({id:id('i'),title,type,done:false,notes:'',file:null}))}function fresh(){const s={id:id('s'),name:'My Show',items:items()};return{version:3,updatedAt:null,activeShowId:s.id,shows:[s]}}function load(){try{const v=JSON.parse(localStorage.getItem(CACHE));if(v?.shows?.length)return v}catch{}return fresh()}function cache(){localStorage.setItem(CACHE,JSON.stringify(state))}function current(){return state.shows.find(s=>s.id===state.activeShowId)||state.shows[0]}function configured(){return API.startsWith('https://')&&!API.includes('PASTE_YOUR_')}
async function init(){bind();normalise();render();await loadShared(false)}function normalise(){if(!state?.shows?.length)state=fresh();if(!state.shows.some(s=>s.id===state.activeShowId))state.activeShowId=state.shows[0].id;state.shows.forEach(s=>{s.id||=id('s');s.name||='Untitled Show';s.items=Array.isArray(s.items)?s.items:[];s.items.forEach(i=>{i.id||=id('i');i.title||='Checklist Item';i.type=label[i.type]?i.type:'file';i.notes||='';i.done=!!i.done})});cache()}
function bind(){$('reload').onclick=()=>loadShared(true);$('save').onclick=saveShared;$('pinBtn').onclick=()=>$('pinDialog').showModal();$('pinForm').onsubmit=e=>{e.preventDefault();sessionStorage.setItem(PIN,$('pin').value.trim());$('pinDialog').close();toast('Edit PIN saved for this tab.')};$('forgetPin').onclick=()=>{sessionStorage.removeItem(PIN);$('pin').value='';toast('Edit PIN forgotten.')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('shows').onchange=e=>{state.activeShowId=e.target.value;cache();render()};$('addShow').onclick=()=>{const n=prompt('Show name');if(!n?.trim())return;const s={id:id('s'),name:n.trim(),items:items()};state.shows.push(s);state.activeShowId=s.id;mark();render()};$('renameShow').onclick=()=>{const s=current(),n=prompt('Show name',s.name);if(!n?.trim())return;s.name=n.trim();mark();render()};$('deleteShow').onclick=()=>{if(state.shows.length<2)return;if(!confirm(`Delete ${current().name}?`))return;state.shows=state.shows.filter(s=>s.id!==state.activeShowId);state.activeShowId=state.shows[0].id;mark();render()};$('addItem').onclick=()=>{const n=prompt('Checklist item name');if(!n?.trim())return;const t=(prompt('Type: document, image, font, audio, video or file','document')||'document').toLowerCase();current().items.push({id:id('i'),title:n.trim(),type:label[t]?t:'file',done:false,notes:'',file:null});mark();render()}}
function mark(){dirty=true;cache();status()}function status(msg,cls=''){const e=$('status');e.className='status'+(cls?' '+cls:'');if(msg){e.textContent=msg;return}if(!configured()){e.textContent='Cloudflare setup needed';e.classList.add('bad')}else if(busy){e.textContent='Working…'}else if(dirty){e.textContent='Unsaved shared changes';e.classList.add('dirty')}else if(state.updatedAt){e.textContent='Shared · '+new Date(state.updatedAt).toLocaleString();e.classList.add('ok')}else e.textContent='Not saved yet'}
function render(){fonts.splice(0).forEach(f=>{try{document.fonts.delete(f)}catch{}});const s=current();$('showTitle').textContent=s.name;document.title=s.name+' — Show Production Checklist';$('shows').replaceChildren(...state.shows.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;o.selected=x.id===s.id;return o}));$('deleteShow').disabled=state.shows.length<2;const done=s.items.filter(i=>i.done).length,p=s.items.length?Math.round(done/s.items.length*100):0;$('progressText').textContent=`${done} of ${s.items.length} complete`;$('progressPct').textContent=p+'%';$('progressBar').style.width=p+'%';const g=$('grid');g.replaceChildren();if(!s.items.length){g.innerHTML='<div class="empty">No checklist items yet.</div>';return}s.items.forEach(i=>g.append(card(s,i)));status()}
function card(show,item){const a=document.createElement('article');a.className='card';a.innerHTML=`<div class="cardhead"><input class="check" type="checkbox"><div><h3></h3><div class="kind"></div></div><button class="x" title="Delete item">×</button></div><div class="preview"><span>No file attached</span></div><div class="meta"></div><div class="assetbuttons"><button class="btn upload">Upload Shared File</button><button class="btn alt link">Attach Link</button><button class="btn alt clear">Remove File</button><input class="picker" type="file" hidden></div><label class="notes"><span>Notes</span><textarea rows="3" placeholder="Add notes…"></textarea></label>`;a.querySelector('h3').textContent=item.title;a.querySelector('.kind').textContent=label[item.type];const c=a.querySelector('.check');c.checked=item.done;c.onchange=()=>{item.done=c.checked;mark();progressOnly()};a.querySelector('.x').onclick=()=>{if(confirm(`Delete ${item.title}?`)){show.items=show.items.filter(x=>x.id!==item.id);mark();render()}};const ta=a.querySelector('textarea');ta.value=item.notes;ta.oninput=()=>{item.notes=ta.value;mark()};const pick=a.querySelector('.picker');pick.accept=accept[item.type]||'*/*';a.querySelector('.upload').onclick=()=>pick.click();pick.onchange=()=>{const f=pick.files?.[0];if(f)upload(show,item,f);pick.value=''};a.querySelector('.link').onclick=()=>{const u=prompt('Paste a direct/public URL',item.file?.url||'');if(!u)return;try{new URL(u)}catch{return toast('That URL is not valid.','err')}item.file={name:decodeURIComponent(u.split('/').pop()?.split('?')[0]||item.title),type:guess(u),url:u,size:0};item.done=true;mark();render()};a.querySelector('.clear').onclick=()=>{item.file=null;item.done=false;mark();render()};a.querySelector('.clear').hidden=!item.file;if(item.file){a.querySelector('.meta').textContent=item.file.name||'Attached file';preview(item,a.querySelector('.preview'))}return a}
function progressOnly(){const s=current(),d=s.items.filter(i=>i.done).length,p=s.items.length?Math.round(d/s.items.length*100):0;$('progressText').textContent=`${d} of ${s.items.length} complete`;$('progressPct').textContent=p+'%';$('progressBar').style.width=p+'%'}
async function getPin(){let p=sessionStorage.getItem(PIN);if(p)return p;$('pinDialog').showModal();return new Promise(r=>{const f=$('pinForm');const done=()=>{f.removeEventListener('submit',done);setTimeout(()=>r(sessionStorage.getItem(PIN)),0)};f.addEventListener('submit',done,{once:true});$('pinDialog').addEventListener('close',()=>setTimeout(()=>r(sessionStorage.getItem(PIN)),0),{once:true})})}
async function loadShared(force){if(!configured()){status();return false}if(force&&dirty&&!confirm('Replace unsaved local changes with the latest shared checklist?'))return false;busy=true;status('Loading shared…');try{const r=await fetch(API+'/state',{cache:'no-store'});if(!r.ok)throw Error('Shared checklist could not be loaded.');const p=await r.json();sha=p.sha||'';if(p.data){state=p.data;dirty=false;normalise();render()}return true}catch(e){toast(e.message,'err');return false}finally{busy=false;status()}}
async function saveShared(){if(!configured())return toast('Cloudflare Worker URL has not been configured yet.','err');const pin=await getPin();if(!pin)return;busy=true;status('Saving shared…');try{state.updatedAt=new Date().toISOString();const r=await fetch(API+'/state',{method:'PUT',headers:{'Content-Type':'application/json','X-Edit-Pin':pin},body:JSON.stringify({data:state,baseSha:sha})});if(r.status===401){sessionStorage.removeItem(PIN);throw Error('The edit PIN was rejected.')}if(r.status===409)throw Error('Someone else saved a newer version. Reload Shared before saving.');const p=await r.json().catch(()=>({}));if(!r.ok)throw Error(p.error||'Shared save failed.');sha=p.sha||sha;dirty=false;cache();toast('Shared checklist saved.');return true}catch(e){dirty=true;toast(e.message,'err');return false}finally{busy=false;status()}}
async function upload(show,item,file){if(file.size>MAX)return toast('That file is over the 20 MB direct-upload limit. Use Attach Link instead.','err');if(!configured())return toast('Cloudflare Worker URL has not been configured yet.','err');const pin=await getPin();if(!pin)return;const fd=new FormData();fd.append('showId',show.id);fd.append('itemId',item.id);fd.append('file',file,file.name);busy=true;status('Uploading shared file…');try{const r=await fetch(API+'/asset',{method:'POST',headers:{'X-Edit-Pin':pin,'X-State-Sha':sha},body:fd});const p=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem(PIN);throw Error('The edit PIN was rejected.')}if(r.status===409)throw Error('Someone else changed the checklist. Reload Shared first.');if(!r.ok)throw Error(p.error||'Upload failed.');item.file={name:file.name,type:file.type||guess(file.name),size:file.size,path:p.path};item.done=true;mark();render();await saveShared()}catch(e){toast(e.message,'err')}finally{busy=false;status()}}
function url(f){if(f?.url)return f.url;if(f?.path&&configured())return API+'/asset?'+new URLSearchParams({path:f.path,type:f.type||'application/octet-stream'});return''}async function preview(i,box){box.replaceChildren();const u=url(i.file),m=i.file?.type||guess(i.file?.name||'');if(!u)return box.textContent='File unavailable';try{if(i.type==='font'){const fam='f'+i.id.replace(/\W/g,'');const ff=new FontFace(fam,`url("${u}")`);await ff.load();document.fonts.add(ff);fonts.push(ff);const d=document.createElement('div');d.className='fontsample';d.style.fontFamily=fam;d.textContent=current().name;box.append(d)}else if(i.type==='audio'||m.startsWith('audio/')){const e=document.createElement('audio');e.controls=true;e.src=u;box.append(e)}else if(i.type==='video'||m.startsWith('video/')){const e=document.createElement('video');e.controls=true;e.playsInline=true;e.src=u;box.append(e)}else if(i.type==='image'||m.startsWith('image/')){const e=document.createElement('img');e.src=u;e.alt=i.title;box.append(e)}else if(m==='application/pdf'||i.file?.name?.toLowerCase().endsWith('.pdf')){const e=document.createElement('iframe');e.src=u;e.title=i.title;box.append(e)}else{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent='Open '+(i.file?.name||'file');box.append(a)}}catch{box.textContent='Preview unavailable'} }
function guess(n){const x=String(n).toLowerCase().split('.').pop(),m={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',svg:'image/svg+xml',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',ttf:'font/ttf',otf:'font/otf',woff:'font/woff',woff2:'font/woff2'};return m[x]||'application/octet-stream'}function toast(t,type=''){let b=document.querySelector('.toastbox');if(!b){b=document.createElement('div');b.className='toastbox';document.body.append(b)}const e=document.createElement('div');e.className='toast'+(type?' '+type:'');e.textContent=t;b.append(e);setTimeout(()=>e.remove(),4500)}
})();
</script>
</body></html>
