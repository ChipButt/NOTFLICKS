<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080a0f" />
  <title>Planuf Apps</title>
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true"><span>P</span></div>
      <div>
        <p class="eyebrow">PLANUF</p>
        <h1>Production Apps</h1>
        <p class="subtitle">Choose a tool to open.</p>
      </div>
    </header>
    <section aria-labelledby="apps-heading">
      <div class="section-heading"><h2 id="apps-heading">Apps</h2><span id="appCount" class="count-pill">Loading…</span></div>
      <div id="appsGrid" class="apps-grid" aria-live="polite"></div>
      <p id="loadError" class="load-error" hidden>Could not load the app list. Reload the page to try again.</p>
    </section>
    <footer><span>Planuf internal production tools</span></footer>
  </main>
  <template id="appCardTemplate">
    <a class="app-card" href="#"><div class="art"><img class="app-image" alt="" hidden><div class="app-icon" aria-hidden="true"></div><div class="art-glow" aria-hidden="true"></div></div><div class="app-copy"><div class="app-heading-row"><h3 class="app-name"></h3><span class="open-arrow" aria-hidden="true">↗</span></div><p class="app-description"></p></div></a>
  </template>
  <script src="./app.js?v=1" defer></script>
</body>
</html>
